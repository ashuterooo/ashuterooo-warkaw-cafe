<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Warkaw Cafe and Restaurant</title>
    <style>
        :root {
            --primary: #d4af37;
            --secondary: #8b0000;
            --dark: #0f0f0f;
            --light: #f4f4f4;
            --glow-color: rgba(212, 175, 55, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            padding: 40px 20px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: var(--dark);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Menu Grid Layout */
        .menu-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(25, 25, 25, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .menu-item:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--light);
        }

        .item-price {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
            white-space: nowrap;
            margin-left: 15px;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 50px auto 20px;
            padding: 12px 30px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--primary);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>ዋርካው ካፌ የምግብ ዝርዝር</h1>
        <p class="subtitle">Warkaw Cafe & Restaurant Complete Menu</p>

    <!-- Category Filter Tabs -->
    <div class="filter-tabs">

        <button class="tab-btn" onclick="filterMenu('Restaurant', this)">Restaurant</button>
        <button class="tab-btn" onclick="filterMenu('Cafe', this)">Cafe</button>
        <button class="tab-btn" onclick="filterMenu('Bar', this)">Bar</button>

        // Function to render items
        function renderMenu(category) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const filtered = category === 'All' 
                ? menuData 
                : menuData.filter(item => item.department === category);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                card.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price}</div>
                `;
                container.appendChild(card);
            });
        }

        // Tab Filtering Handler
        function filterMenu(category, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderMenu(category);
        }

        // Initial Load
        renderMenu('All');
    </script>
